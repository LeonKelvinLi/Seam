name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node docs/verify-deploy-assets.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start server and run the production flow test
        env:
          SEAM_DATA_DIR: /tmp/seam-e2e
          SEAM_FORCE_PROVIDER: local
          SEAM_DEFAULT_MODE: preview
          # The quality bars are calibrated for the vision judge. CI has no OpenAI key, so the ffmpeg bridge is scored on
          # pixel statistics and capped at 80; this job tests the flow, not the bar.
          SEAM_QUALITY_THRESHOLD_PREVIEW: "70"
          NODE_ENV: production
          PORT: "3100"
        run: |
          npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/api/runtime && break; sleep 2; done
          E2E_BASE_URL=http://localhost:3100 npm run e2e
      - if: failure()
        run: tail -100 server.log
