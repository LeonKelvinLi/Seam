services:
  - type: web
    name: seamcut
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    disk:
      name: seam-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEAM_DATA_DIR
        value: /var/data/seam
      - key: SEAM_DEFAULT_MODE
        value: preview
      - key: SEAM_MAX_ATTEMPTS
        value: "2"
      - key: SEAM_FORCE_PROVIDER
        value: ""
      - key: SEAM_QUALITY_THRESHOLD_PREVIEW
        value: "65"
      - key: SEAM_QUALITY_THRESHOLD
        value: "72"
      - key: SEAM_PARALLEL_ATTEMPTS
        value: "1"
      - key: SEAM_DAILY_PROVIDER_BUDGET_USD
        value: "25"
      - key: SEAM_VISION_MODEL
        value: gpt-5.4-mini
      - key: SEAM_JUDGE_MODEL
        value: gpt-5.4-mini
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: FFPROBE_PATH
        value: /usr/bin/ffprobe
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SEAM_PUBLIC_URL
        value: https://seamcut.onrender.com
      - key: STRIPE_PRICE_STARTER
        value: price_1UClYNLnwdL8dIyODfVjfTo7
      - key: STRIPE_PRICE_PRO
        value: price_1UClYRLnwdL8dIyOVdoCCNTH
      - key: STRIPE_PRICE_STUDIO
        value: price_1UClYTLnwdL8dIyOHJQfG3tx
      - key: STRIPE_LINK_STARTER
        value: https://buy.stripe.com/cNiaEYbeSbuscvvcWe9Zm00
      - key: STRIPE_LINK_PRO
        value: https://buy.stripe.com/3cIfZigzcbus0MNg8q9Zm01
      - key: STRIPE_LINK_STUDIO
        value: https://buy.stripe.com/6oUeVe1Ei0PO0MN8FY9Zm02
# RESEND_API_KEY (+ non-secret SEAM_MAIL_FROM) enables password reset and email confirmation mail.
# Provider keys (FAL_KEY, RUNWAYML_API_SECRET, HIGGSFIELD_API_KEY_ID + HIGGSFIELD_API_KEY_SECRET, OPENAI_API_KEY) are secrets: add them privately in Render's
# Environment settings to turn on AI bridges and vision analysis; without them the router stays on local ffmpeg.
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are secrets: add them privately in Render's
# Environment settings (never in this file). STRIPE_WEBHOOK_SECRET verifies Payment Link
# purchases locally. STRIPE_SECRET_KEY is needed only for server-created Checkout Sessions.
# OPENAI_API_KEY is optional and must be added privately in Render's Environment
# settings when paid visual analysis is intended. No keys are required for preview.
